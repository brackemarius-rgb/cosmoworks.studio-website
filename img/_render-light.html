<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://api.fontshare.com/v2/css?f[]=switzer@800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { width: 1320px; height: 1320px; }
  svg { display: block; width: 1320px; height: 1320px; }
</style>
</head>
<body>
<svg viewBox="182 182 660 660" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="105"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.045"/></feComponentTransfer>
    </filter>
    <clipPath id="clip-frame"><rect x="185" y="185" width="654" height="654"/></clipPath>
  </defs>
  <g clip-path="url(#clip-frame)">
    <rect x="185" y="185" width="654" height="654" fill="#fbfaf6"/>
    <circle cx="-180" cy="-230" r="680" fill="#7d8a7a" opacity="0.38" filter="url(#blur)"/>
    <circle cx="630" cy="650" r="720" fill="#a89888" opacity="0.34" filter="url(#blur)"/>
    <circle cx="90" cy="630" r="740" fill="#dcc49c" opacity="0.5" filter="url(#blur)"/>
    <circle cx="510" cy="-120" r="620" fill="#fbfaf6" opacity="0.48" filter="url(#blur)"/>
    <rect x="185" y="185" width="654" height="654" filter="url(#grain)" opacity="0.7" style="mix-blend-mode:multiply"/>
  </g>
  <rect x="185" y="185" width="654" height="654" fill="none" stroke="#1a1814" stroke-opacity="1" stroke-width="6"/>
  <line x1="512" y1="260" x2="512" y2="770" stroke="#1a1814" stroke-opacity="0.62" stroke-width="3"/>
  <line x1="245" y1="512" x2="779" y2="512" stroke="#1a1814" stroke-opacity="0.62" stroke-width="3"/>
  <g fill="#1a1814" font-family="Switzer, Arial, Helvetica, sans-serif" font-weight="800" font-size="168" text-anchor="middle" dominant-baseline="middle" letter-spacing="-8">
    <text x="335" y="375">C</text>
    <text x="690" y="375">S</text>
    <text x="335" y="665">W</text>
    <text x="690" y="665">S</text>
  </g>
</svg>
</body></html>
