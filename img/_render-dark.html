<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://api.fontshare.com/v2/css?f[]=switzer@800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { width: 1320px; height: 1320px; }
  svg { display: block; width: 1320px; height: 1320px; }
</style>
</head>
<body>
<svg viewBox="182 182 660 660" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="105"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.045"/></feComponentTransfer>
    </filter>
    <clipPath id="clip-frame"><rect x="185" y="185" width="654" height="654"/></clipPath>
  </defs>
  <g clip-path="url(#clip-frame)">
    <rect x="185" y="185" width="654" height="654" fill="#1a1814"/>
    <circle cx="-210" cy="-210" r="620" fill="#7d8a7a" opacity="0.42" filter="url(#blur)"/>
    <circle cx="650" cy="590" r="720" fill="#a89888" opacity="0.36" filter="url(#blur)"/>
    <circle cx="730" cy="620" r="560" fill="#dcc49c" opacity="0.28" filter="url(#blur)"/>
    <circle cx="300" cy="260" r="760" fill="#0f1110" opacity="0.62" filter="url(#blur)"/>
    <rect x="185" y="185" width="654" height="654" filter="url(#grain)" opacity="0.7" style="mix-blend-mode:multiply"/>
  </g>
  <rect x="185" y="185" width="654" height="654" fill="none" stroke="#fbfaf6" stroke-opacity="0.92" stroke-width="6"/>
  <line x1="512" y1="260" x2="512" y2="770" stroke="#f3f0e8" stroke-opacity="0.58" stroke-width="3"/>
  <line x1="245" y1="512" x2="779" y2="512" stroke="#f3f0e8" stroke-opacity="0.58" stroke-width="3"/>
  <g fill="#fbfaf6" font-family="Switzer, Arial, Helvetica, sans-serif" font-weight="800" font-size="168" text-anchor="middle" dominant-baseline="middle" letter-spacing="-8">
    <text x="335" y="375">C</text>
    <text x="690" y="375">S</text>
    <text x="335" y="665">W</text>
    <text x="690" y="665">S</text>
  </g>
</svg>
</body></html>
